<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../src/output.css">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>Login Page</title>
</head>
<body class="bg-blue-950 flex justify-center items-center h-screen">
   <div class="bg-white h-[80%] w-[80%] flex rounded-4xl overflow-hidden ">

        <!-- left-side login form section start  -->

        <div class="h-full w-[35%] p-10">

            <div class="flex items-center space-x-2 text-blue-900">
                <div class="text-4xl"><i class="fa-solid fa-layer-group"></i></i></div>
                <div class="font-extrabold text-xl">
                    <h1>Template</h1>
                    <h1>Design</h1>
                </div>
            </div>


            <div class="mt-10 flex-col items-center justify-center">

                <div class="text-8xl text-blue-900 text-center"><i class="fa-solid fa-circle-user"></i></div>

                <div class="space-y-4 mt-6 flex-col">
                    <div class="flex justify-center">
                        <div class="w-[15%] border-y-3 border-l-3 border-blue-900 rounded-l-2xl text-blue-900 text-right pr-2 text-xl "><i class="fa-regular fa-user"></i></div>
                        <input class="w-[75%] border-y-3 border-r-3 border-blue-900 rounded-r-2xl uppercase text-blue-900 placeholder:text-blue-900 pl-3 focus:outline-none font-semibold" type="text" placeholder="username">
                    </div>

                    <div class="flex justify-center">
                        <div class="w-[15%] border-y-3 border-l-3 border-blue-900 rounded-l-2xl text-blue-900 text-right pr-2 text-xl "><i class="fa-solid fa-lock"></i></div>
                        <input class="w-[75%] border-y-3 border-r-3 border-blue-900 rounded-r-2xl uppercase text-blue-900 placeholder:text-blue-900 pl-3 focus:outline-none font-semibold" type="password" placeholder="●●●●●●●●●●●">
                    </div>

                    <div class="flex justify-center">
                        <button class="bg-blue-900 text-sm uppercase text-white font-bold w-[90%] p-1 rounded-2xl">Login</button>
                    </div>

                    <div>
                        <div class="flex justify-center items-center font-bold text-blue-900">
                            <div class="w-[50%] flex-row justify-start space-x-px text-xs">
                                <input class="" type="radio" name="remember">
                                <span class="pb-px">Remember Me</span>
                            </div>   
                            <div class="flex-row-reverse justify-end text-xs">
                                <a href="#" class="hover:text-blue-500">Forget your password?</a>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
            
        </div>

        <!-- left-side login form section end  -->

        <!-- right-side welcome image section start -->
        <div class="bg-[url(https://images.pexels.com/photos/12966762/pexels-photo-12966762.jpeg)]  bg-cover h-full w-[65%] flex flex-col">

            <div class="flex justify-end items-center text-xs text-white font-semibold space-x-10 px-14 py-10">
               
                <ul class="flex space-x-10">
                    <li>ABOUT</li>
                    <li>DOWNLOAD</li>
                    <li>PRICING</li>
                    <li>CONTACT</li>
                </ul>

                <div>
                    <button class="bg-blue-900 px-5 py-1 rounded-2xl">SIGN IN</button>
                </div>

                <div class="text-xl">
                    <i class="fa-solid fa-bars"></i>
                </div>
            </div>

            <div class="h-full flex-1 p-14 text-right flex flex-col justify-end space-y-3 text-white">
                 <div class="text-7xl font-extrabold">
                    <p>Welcome.</p>
                 </div>
                 <div class="text-xs max-w-[30%] ml-auto">
                    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Odit nam vero eos at distinctio, ipsa</p>
                 </div>
                 <div class="text-sm">
                    <p>Not a member? <a href="#" class="font-bold underline"> Sign up now</a></p>
                 </div>
            </div>
        </div>
        <!-- right-side welcome image section end -->
         
   </div>
</body>
</html>
